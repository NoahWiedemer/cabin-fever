<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weapon Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0d0f; color: #d8d4cc; font: 12px/1.4 system-ui, sans-serif; }
      #view { position: fixed; inset: 0; }
      #view canvas { display: block; width: 100%; height: 100%; }
      #panel { position: fixed; top: 10px; left: 10px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; max-width: 760px; align-items: center;
        background: rgba(12, 13, 15, 0.8); padding: 8px 10px; border: 1px solid #333; border-radius: 4px; }
      #panel button, #panel select { background: #22252a; color: inherit; border: 1px solid #444; padding: 4px 8px; border-radius: 3px; cursor: pointer; font: inherit; }
      #panel label { display: flex; gap: 4px; align-items: center; }
      #info { position: fixed; bottom: 10px; left: 10px; z-index: 5; opacity: 0.7; white-space: pre; }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="panel"></div>
    <div id="info"></div>
    <script type="module" src="/src/tools/viewer.js"></script>
  </body>
</html>
